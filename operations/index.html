    }

var WK=["mon","tue","wed","thu","fri"], DOWN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var HOURS={ max:{days:WK,s:"07:00",e:"15:30"}, rick:{days:WK,s:"07:00",e:"15:30"}, kenny:{days:WK,s:"08:00",e:"16:30"},
  judah:{days:WK,s:"07:30",e:"16:00"}, aaron:{days:WK,s:"06:00",e:"14:30"}, marah:{days:["tue","wed","thu","fri","sat"],s:"09:00",e:"17:30"}, lexi:{days:WK,s:"09:00",e:"17:30"} };
function hm(t){ var p=t.split(":"), h=+p[0], m=+p[1]; return (h%12||12)+(m?":"+String(m).padStart(2,"0"):"")+" "+(h<12?"AM":"PM"); }
function dkey(d){ return ["sun","mon","tue","wed","thu","fri","sat"][new Date(d+"T12:00:00").getDay()]; }
function weekDays(){ var t=today(), dow=new Date(t+"T12:00:00").getDay(), mon=addDays(t, dow===0?1:dow===6?2:1-dow); return [0,1,2,3,4].map(function(i){return addDays(mon,i);}); }
function timeOff(){ var t=today(), w=weekDays();
  return [{who:"aaron",kind:"PTO",from:t,to:addDays(t,1)},{who:"kenny",kind:"Other",from:t,to:t,part:"Out after 12 PM"},{who:"marah",kind:"Vacation",from:w[2],to:addDays(w[4],7)}]; }
function offOn(id,d){ return timeOff().find(function(o){ return o.who===id && o.from<=d && o.to>=d; }); }
// Today's status for someone with a schedule: {on:true,hours} | {on:false,why}
function sched(id,d){ d=d||today(); var h=HOURS[id]; if(!h) return null;
  var o=offOn(id,d), works=h.days.indexOf(dkey(d))>=0;
  if(o && !o.part) return {on:false, why:o.kind+(o.to>d?" through "+dshort(o.to):"")};
  if(!works) return {on:false, why:"Not scheduled"};
  return {on:true, hours:hm(h.s)+" – "+hm(h.e), note:o?o.part:""}; }
function schedStrip(t){
  var ids=Object.keys(PEOPLE).filter(function(id){return PEOPLE[id].team===t && HOURS[id];}); if(!ids.length) return "";
  var td=today(), out=ids.filter(function(id){return !sched(id).on;}), part=ids.filter(function(id){var x=sched(id); return x.on && x.note;});
  var week=weekDays().map(function(d){ var o=ids.filter(function(id){ return !sched(id,d).on; });
    return '<div class="'+(d===td?'today':'')+'"><b>'+DOWN[new Date(d+"T12:00:00").getDay()]+' '+(+d.split("-")[2])+'</b>'+(o.length?o.map(function(id){return '<span title="'+esc(PEOPLE[id].name+" · "+sched(id,d).why)+'">'+esc(PEOPLE[id].name)+'</span>';}).join(""):'<i>All in</i>')+'</div>'; }).join("");
  return '<div class="sch" style="--c:'+TEAMS[t].c+'"><span><span class="n">'+(ids.length-out.length)+'</span> of '+ids.length+' on site today</span>'
    +'<span class="outs">'+out.map(function(id){return '<span class="pill away">'+esc(PEOPLE[id].name)+' · '+esc(sched(id).why)+'</span>';}).join("")
    +part.map(function(id){return '<span class="pill chk">'+esc(PEOPLE[id].name)+' · '+esc(sched(id).note)+'</span>';}).join("")+'</span>'
    +'<div class="sch-week">'+week+'</div></div>';
}

function nowFor(id){
  var sc=sched(id);
  if(sc && !sc.on) return {pill:"away", tag:"Out", text:sc.why==="Not scheduled"?"Not scheduled today":"Out today · "+esc(sc.why), out:true};
  var r=S.reqs.find(function(r){ return r.status==="In Progress" && r.startedAt && r.who.indexOf(id)>=0; });
  if(r) return {pill:"req", tag:"Request", text:"<b>"+esc(r.subject)+"</b>"+(r.location?" · "+esc(r.location):"")+" · "+since(r.startedAt)};
  var c=S.check.find(function(c){ return c.timerSince && c.who===id; });
  if(c) return {pill:"chk", tag:"Checklist", text:"<b>"+esc(c.name)+"</b> · "+since(c.timerSince)};
  var f=S.reqs.find(function(r){ return r.from===BOSS && r.status==="New" && r.who.indexOf(id)>=0; });
  if(f) return {pill:"new", tag:"From you", text:"Hasn't started <b>"+esc(f.subject)+"</b> yet"};
  var t=S.tools.find(function(t){ return t.who===id; });
  if(t) return {pill:TEAMS[t.team].pill, tag:t.team==="media"?"Gear":"Tool", text:"Has the <b>"+esc(t.item)+"</b> · "+esc(t.where)+" · since "+clock(t.since)};
  var e=S.crew.find(function(e){ return e.who===id; });
  if(e) return {pill:"evt", tag:"Event", text:"Crew on <b>"+esc(e.event)+"</b>"};
  return {pill:"free", tag:"Free", text:"Not on anything right now"};
}

  var wx=loadWeekendWeather().then(function(w){WX=w;}).catch(function(e){WXERR=e.message||"Weather unavailable";});

/* ---------- sheets ---------- */
function sheet(title, body){
  $("layer").innerHTML='<div class="modal-back" data-close="1"><div class="ops-sheet" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="sh"><h3>'+esc(title)+'</h3><button class="x" data-close="1" aria-label="Close">×</button></div>'+body+'</div></div>';
  var f=$("layer").querySelector("input[type=text]"); if(f) f.focus();
}
function closeSheet(){ $("layer").innerHTML=""; $("layer").onclick=null; }
function closeHit(e,b){ if(b.dataset.close){ if(e.target===b) closeSheet(); return true; } return false; }
function personChips(sel, team){
  return '<div class="chips">'+Object.keys(PEOPLE).filter(function(id){return !team||PEOPLE[id].team===team;}).map(function(id){ return '<button type="button" class="chip'+(sel.indexOf(id)>=0?' on':'')+'" data-pp="'+id+'">'+av(id)+esc(PEOPLE[id].name)+'</button>'; }).join("")+'</div>';
}
function openAsk(pid){
  var sel=pid?[pid]:[], due="week";
  function draw(){
    var v=$("ask-what")?$("ask-what").value:"";
    sheet(pid?"Ask "+PEOPLE[pid].name:"Ask someone",
      (pid?'<div style="display:flex;gap:12px;align-items:center">'+av(pid)+'<div><b>'+esc(PEOPLE[pid].name)+'</b> <span class="muted">· '+teamShort(PEOPLE[pid].team)+'</span><div class="muted" style="font-size:14px">'+nowFor(pid).text.replace(/<[^>]+>/g,"")+'</div></div></div>'
        :'<div><p class="q">Who?</p>'+["facilities","events","media"].map(function(t){return '<p class="muted" style="margin:10px 0 6px;font-size:13px">'+TEAMS[t].name+'</p>'+personChips(sel,t);}).join("")+'</div>')+
      '<label>What do you need?<input type="text" id="ask-what" placeholder="e.g. Fix the lobby door that sticks"></label>'+
      '<div><p class="q">By when?</p><div class="chips">'+[["today","Today"],["week","This week"],["none","No rush"]].map(function(x){return '<button type="button" class="chip'+(due===x[0]?' on':'')+'" data-due="'+x[0]+'">'+x[1]+'</button>';}).join("")+'</div></div>'+
      '<button class="btn primary block" data-act="sendask">Send'+(pid?' to '+esc(PEOPLE[pid].name):'')+'</button>');
    $("ask-what").value=v;
    $("layer").onclick=click;
  }
  function click(e){
    var b=e.target.closest("[data-pp],[data-due],[data-act],[data-close]"); if(!b||closeHit(e,b)) return;
    if(b.dataset.pp){ sel=sel[0]===b.dataset.pp?[]:[b.dataset.pp]; draw(); return; }
    if(b.dataset.due){ due=b.dataset.due; draw(); return; }
    if(b.dataset.act==="sendask"){
      var what=$("ask-what").value.trim(), who=pid||sel[0];
      if(!who){ toast("Pick who it's for"); return; }
      if(!what){ $("ask-what").focus(); toast("Say what you need"); return; }
      var p=PEOPLE[who];
      S.reqs.push({id:++S.seq, team:p.team, subject:what, location:"", status:"New", who:[who], due:due==="today"?today():due==="week"?addDays(today(),5):null, from:BOSS});
      save(); closeSheet(); toast("Sent to "+p.name+". Their phone just buzzed."); render();
    }
  }
  draw();
}
function openReq(id){
  var r=S.reqs.find(function(x){return x.id===id;}); if(!r) return;
  var sel=r.who.slice();
  function draw(keep){
    sheet(r.subject,
      '<span class="muted" style="margin-top:-8px">'+TEAMS[r.team].name+' · '+esc(r.status)+(r.from?' · from '+esc(r.from):'')+'</span>'+
      '<label>What<input type="text" id="e-what" value="'+esc(keep?keep.what:r.subject)+'"></label>'+
      '<label>Where<input type="text" id="e-where" value="'+esc(keep?keep.where:r.location)+'"></label>'+
      '<label>Due<input type="date" id="e-due" value="'+(keep?keep.due:(r.due||""))+'"></label>'+
      '<div><p class="q">Who\'s on it?</p>'+personChips(sel, r.team)+'</div>'+
      '<div class="ops-actions">'+(isOpen(r)?(r.status!=="In Progress"?'<button class="btn" data-act="rstart">▶ Start</button>':'')+'<button class="btn in" data-act="rdone">✓ Done</button>':'<button class="btn" data-act="rreopen">Reopen</button>')+'<button class="btn primary push" data-act="rsave">Save</button></div>');
    $("layer").onclick=click;
  }
  function click(e){
    var b=e.target.closest("[data-pp],[data-act],[data-close]"); if(!b||closeHit(e,b)) return;
    if(b.dataset.pp){ var keep={what:$("e-what").value,where:$("e-where").value,due:$("e-due").value}; var i=sel.indexOf(b.dataset.pp); if(i>=0) sel.splice(i,1); else sel.push(b.dataset.pp); draw(keep); return; }
    r.subject=$("e-what").value.trim()||r.subject; r.location=$("e-where").value.trim(); r.due=$("e-due").value||null;
    var added=sel.filter(function(x){return r.who.indexOf(x)<0;}); r.who=sel.slice();
    if(added.length) toast("Assigned "+added.map(function(x){return PEOPLE[x].name;}).join(" and ")+". They've been notified.");
    var a=b.dataset.act;
    if(a==="rstart"){ if(!r.who.length){ toast("Pick who's on it first"); return; } startReq(r); }
    if(a==="rdone") doneReq(r);
    if(a==="rreopen"){ r.status="New"; r.startedAt=null; }
    if(a==="rsave" && !added.length) toast("Saved");
    save(); closeSheet(); render();
  }
  draw();
}
function startReq(r){ r.status="In Progress"; r.startedAt=new Date().toISOString(); }
function doneReq(r){
  r.status="Complete";
  var names=r.who.map(function(x){return PEOPLE[x]?PEOPLE[x].name:x;}).join(" and ")||"Someone";
  notify("<b>"+esc(names)+" finished:</b> "+esc(r.subject)+(r.from===BOSS?" (you asked for this)":""));
  toast(r.from===BOSS?"Done. "+BOSS+" gets an alert.":"Done.");
}
function openChk(id){
  var c=S.check.find(function(x){return x.id===id;}); if(!c) return;
  var steps=JSON.parse(JSON.stringify(c.steps)), every=!c.oneOff;
  function draw(){
    var nm=$("c-name")?$("c-name").value:c.name;
    sheet("Edit task",
      '<label>Task<input type="text" id="c-name" value="'+esc(nm)+'"></label>'+
      '<div><p class="q">Steps</p><div class="steps">'+(steps.map(function(s,i){return '<label><input type="checkbox" data-st="'+i+'"'+(s.d?' checked':'')+'><span>'+esc(s.t)+'</span><button type="button" class="rm" data-rm="'+i+'" aria-label="Remove step">×</button></label>';}).join("")||'<p class="muted">No steps yet.</p>')+'</div>'+
      '<div style="display:flex;gap:10px;margin-top:10px"><input type="text" id="c-step" placeholder="Add a step" style="flex:1;min-width:0"><button type="button" class="btn" data-act="addstep">Add</button></div></div>'+
      '<div><p class="q">Change it for</p><div class="chips"><button type="button" class="chip'+(!every?' on':'')+'" data-every="0">This week only</button><button type="button" class="chip'+(every?' on':'')+'" data-every="1">Every week</button></div></div>'+
      '<div class="ops-actions"><button class="btn bad" data-act="cdel">Remove task</button><button class="btn primary push" data-act="csave">Save</button></div>');
    $("layer").onclick=click;
  }
  function click(e){
    var b=e.target.closest("[data-rm],[data-act],[data-every],[data-close],[data-st]"); if(!b||closeHit(e,b)) return;
    if(b.dataset.st!=null){ steps[+b.dataset.st].d=b.checked; return; }
    if(b.dataset.rm!=null){ e.preventDefault(); steps.splice(+b.dataset.rm,1); draw(); return; }
    if(b.dataset.every!=null){ every=b.dataset.every==="1"; draw(); return; }
    if(b.dataset.act==="addstep"){ var v=$("c-step").value.trim(); if(v){ steps.push({t:v,d:false}); draw(); } return; }
    if(b.dataset.act==="cdel"){ S.check=S.check.filter(function(x){return x.id!==id;}); toast(every?"Removed from every week":"Removed for this week"); }
    if(b.dataset.act==="csave"){ c.name=$("c-name").value.trim()||c.name; c.steps=steps; toast(every?"Saved. It changes every week from now on.":"Saved for this week only."); }
    save(); closeSheet(); render();
  }
  draw();
}
function openNotifs(){
  sheet("Alerts", '<div>'+(S.notifs.map(function(n){return '<div class="notif-row"><span class="ops-grow">'+n.text+'</span><span class="muted" style="font-size:13px;white-space:nowrap">'+clock(n.at)+'</span></div>';}).join("")||'<p class="muted">Nothing yet.</p>')+'</div>');
  S.notifs.forEach(function(n){n.read=true;}); save();
  $("layer").onclick=function(e){ var b=e.target.closest("[data-close]"); if(b && e.target===b){ closeSheet(); render(); } };
}

/* ---------- routing + events ---------- */
var route="ops";
function render(){
  var h=(location.hash||"#ops").slice(1); route=h;
  var m=h.match(/^(facilities|events|media)(?:-(\w+))?$/);
  if(m) return renderTeam(m[1], m[2]||"requests");
  if(h==="people") return renderPeople();
  if(h==="requests") return renderAllRequests();
  if(h==="form") return renderForm();
  renderOps();
}
window.addEventListener("hashchange", function(){ closeSheet(); render(); window.scrollTo(0,0); });
document.addEventListener("click", function(e){
  if(e.target.closest("#layer")) return;
  var b=e.target.closest("[data-person],[data-act],[data-start],[data-done],[data-req],[data-tick],[data-timer],[data-chk],[data-pick],[data-when],[data-filter]"); if(!b) return;
  if(b.dataset.person){ openAsk(b.dataset.person); return; }
  if(b.dataset.start){ var r=S.reqs.find(function(x){return x.id===+b.dataset.start;}); if(!r.who.length){ openReq(r.id); toast("Pick who's on it, then Start"); return; } startReq(r); save(); toast("Started. The timer is running."); render(); return; }
  if(b.dataset.done){ doneReq(S.reqs.find(function(x){return x.id===+b.dataset.done;})); save(); render(); return; }
  if(b.dataset.tick){ var c=S.check.find(function(x){return x.id===+b.dataset.tick;}); if(c.status==="Done") c.status="Not started"; else { c.status="Done"; c.timerSince=null; c.who=c.who||"lexi"; } save(); render(); return; }
  if(b.dataset.timer){ var c2=S.check.find(function(x){return x.id===+b.dataset.timer;}); if(c2.timerSince) c2.timerSince=null; else { c2.timerSince=new Date().toISOString(); c2.who=c2.who||"marah"; } save(); render(); return; }
  if(b.dataset.chk){ openChk(+b.dataset.chk); return; }
  if(b.dataset.req && (b.classList.contains("req-card") || !e.target.closest("button"))){ openReq(+b.dataset.req); return; }
  if(b.dataset.filter){ reqFilter=b.dataset.filter; render(); return; }
  if(b.dataset.pick){ formState.team=b.dataset.pick; document.querySelectorAll("[data-pick]").forEach(function(x){x.classList.toggle("on", x===b);}); return; }
  if(b.dataset.when){ document.querySelectorAll("[data-when]").forEach(function(x){x.classList.toggle("on", x===b);}); return; }
  var a=b.dataset.act;
  if(a==="tour") startTour();
  else if(a==="wx") openWx();
  else if(a==="teams") openTeams();
  else if(a==="notifs") openNotifs();
  else if(a==="tip"){ S.tipOff=true; save(); render(); }
  else if(a==="again"){ formState={team:null,sent:null}; render(); }
  else if(a==="reset"){ if(b.dataset.arm){ S=seed(); formState={team:null,sent:null}; save(); toast("Back to the start"); location.hash="#ops"; render(); } else { b.dataset.arm="1"; b.textContent="Tap again to start over"; } }
});
document.addEventListener("submit", function(e){
  e.preventDefault();
  if(e.target.id==="addtask"){ var v=$("newtask").value.trim(); if(!v) return; S.check.push({id:Date.now(), name:v, area:"Building", status:"Not started", who:null, steps:[], oneOff:true}); save(); toast("Added for today. Tap it to make it every week."); render(); return; }
  if(e.target.id==="reqform"){
    var map={maint:"facilities",clean:"facilities",event:"events",media:"media"};
    if(!formState.team){ toast("Pick what you need help with"); return; }
    var what=$("f-what").value.trim(), where=$("f-where").value.trim();
    if(!what){ $("f-what").focus(); toast("Say what needs doing"); return; } if(!where){ $("f-where").focus(); toast("Say where"); return; }
    var w=(document.querySelector("[data-when].on")||{dataset:{}}).dataset.when, t=map[formState.team], no=++S.seq, name=$("f-name").value.trim();
    S.reqs.push({id:no, team:t, subject:what, location:where, status:"New", who:[], due:w==="now"?today():w==="week"?addDays(today(),5):null, from:name?name.split(" ")[0]+" (form)":"Request form"});
    notify("<b>New request from the form:</b> "+esc(what)+" · "+TEAMS[t].name+(w==="now"?' · <span class="late-txt">Emergency</span>':''));
    formState.sent={no:no, team:t, name:name.split(" ")[0]}; save(); render(); window.scrollTo(0,0);
  }
});
setInterval(function(){ if(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return; if(!$("layer").innerHTML && route!=="form") render(); }, 60000);
/* ---------- Guided tour: runs the first time, and from the ? button ---------- */
var TOUR_KEY="mc-ops-tour-v1";
var phone=function(){ return matchMedia("(max-width: 760px)").matches; };
var TOUR=[
  {title:"Hi "+BOSS+" 👋", text:"This is your Operations hub: every team you're over, where people are, and what's going on, in one place. This quick tour takes about a minute. Tap Next."},
  {sel:"#wx-corner", title:"This weekend", text:"The weekend weather, Friday to Sunday. Facilities posts a gameplan for each day based on the forecast, so you know what's being done about rain or wind. Tap the card for hour by hour."},
  {sel:".stats", title:"The big numbers", text:"Who's working on something right now, open requests across every team, anything past due, and how far the custodial team is through today's checklist."},
  {sel:"#app .ops-list", title:"Where people are", text:"Everyone on your teams and what they're doing: a request, the checklist, a tool or gear they have out, or out for the day. Tap anyone to ask them for something; it lands on their list as From "+BOSS+"."},
  {sel:".ops-teams", title:"Your teams", text:"Facilities, Events and Media at a glance. Open a team's live site to see exactly what they use, or preview it right here."},
  {sel:function(){ return phone()?'.tabbar a[href="#requests"]':'#nav a[href="#requests"]'; }, title:"All requests", text:"Every open request from every team in one list, soonest due first. Filter by team, tap one to assign it or change the due date."},
  {sel:function(){ return phone()?'.tabbar a[href="#form"]':'#nav a[href="#form"]'; }, title:"One request form", text:"One link for the whole church. People pick what they need (facilities, an event, media) and it goes straight to the right team. No login."},
  {sel:".alerts", title:"Alerts", text:"New requests and anything sent your way show up here."},
  {title:"That's it", text:"Click around and try things. This is a preview with example data, so nothing you do here changes the real sites. The weather and the Facilities gameplan are live. Tap the ? at the top any time to see this again."}
];
var tourAt=-1;
function startTour(){
  closeSheet();
  if((location.hash||"#ops")!=="#ops"){ location.hash="#ops"; setTimeout(function(){ showTour(0); }, 350); return; }
  showTour(0);
}
function endTour(){
  tourAt=-1; ["tour-back","tour-hole","tour-tip"].forEach(function(id){ var e=$(id); if(e) e.remove(); });
  try{ localStorage.setItem(TOUR_KEY,"1"); }catch(e){}
  window.removeEventListener("resize", placeTour);
}
function showTour(i){
  tourAt=i;
  if(!$("tour-back")){
    ["tour-back","tour-hole","tour-tip"].forEach(function(id){ var d=document.createElement("div"); d.id=id; d.className=id; document.body.appendChild(d); });
    $("tour-back").addEventListener("click", function(e){ e.stopPropagation(); });
    window.addEventListener("resize", placeTour);
  }
  var st=TOUR[i];
  $("tour-tip").innerHTML='<div class="step">'+(i+1)+' of '+TOUR.length+'</div><h3>'+esc(st.title)+'</h3><p>'+esc(st.text)+'</p>'
    +'<div class="tour-foot"><span class="dots">'+TOUR.map(function(_,k){return '<i class="'+(k===i?'on':'')+'"></i>';}).join("")+'</span>'
    +(i<TOUR.length-1?'<button class="skip" data-tour="skip">Skip</button>':'')
    +(i?'<button class="btn small" data-tour="back">Back</button>':'')
    +'<button class="btn small primary" data-tour="next">'+(i===TOUR.length-1?"Done":i===0?"Show me":"Next")+'</button></div>';
  $("tour-tip").querySelectorAll("[data-tour]").forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); var t=b.dataset.tour;
    if(t==="skip"||(t==="next"&&tourAt===TOUR.length-1)) return endTour();
    showTour(tourAt+(t==="next"?1:-1)); }; });
  var el=tourTarget(st);
  if(el && !el.closest(".topbar, .tabbar")){
    // Bring it into view right away (no smooth scroll, so the highlight lands in the right place).
    var head=document.querySelector(".topbar").getBoundingClientRect().bottom, r=el.getBoundingClientRect();
    var room=innerHeight-head-(phone()?$("tour-tip").offsetHeight+24:$("tour-tip").offsetHeight+40);
    window.scrollTo(0, window.scrollY + r.top - head - (r.height < room ? Math.max(12, (room - r.height) / 2) : 12));
  }
  requestAnimationFrame(placeTour);
  $("tour-tip").querySelector('[data-tour="next"]').focus({preventScroll:true});
}
function tourTarget(st){ if(!st||!st.sel) return null; var sel=typeof st.sel==="function"?st.sel():st.sel; var el=document.querySelector(sel); return el && el.getClientRects().length ? el : null; }
function placeTour(){
  if(tourAt<0) return;
  var hole=$("tour-hole"), tip=$("tour-tip"), el=tourTarget(TOUR[tourAt]);
  if(!el){ hole.className="tour-hole none"; tip.style.left=Math.max(16,(innerWidth-tip.offsetWidth)/2)+"px"; tip.style.top=Math.max(16,(innerHeight-tip.offsetHeight)/2)+"px"; return; }
  var r=el.getBoundingClientRect(), pad=8, th=tip.offsetHeight, tw=tip.offsetWidth;
  var inBar=!!el.closest(".topbar, .tabbar");
  var head=inBar?0:document.querySelector(".topbar").getBoundingClientRect().bottom;
  // Keep the highlight on screen: below the header, and above the tip on a phone.
  var top=Math.max(r.top, head+pad+4), bottom=Math.min(r.bottom, innerHeight-(phone()&&!inBar?th+28:pad+4));
  if(phone()&&el.closest(".tabbar")) bottom=r.bottom;
  hole.className="tour-hole";
  hole.style.left=(r.left-pad)+"px"; hole.style.top=(top-pad)+"px"; hole.style.width=(r.width+pad*2)+"px"; hole.style.height=Math.max(20, bottom-top+pad*2)+"px";
  if(phone()){ tip.style.left="16px"; tip.style.top=(el.closest(".tabbar") ? r.top-pad-12-th : el.closest(".topbar") ? r.bottom+pad+12 : innerHeight-th-16)+"px"; return; }
  r={top:top, bottom:bottom, left:r.left, width:r.width};
  var below=r.bottom+pad+12, above=r.top-pad-12-th;
  var top = below+th < innerHeight-8 ? below : above > 8 ? above : Math.max(8, innerHeight-th-8);
  tip.style.top=top+"px";
  tip.style.left=Math.min(Math.max(16, r.left+r.width/2-tw/2), innerWidth-tw-16)+"px";
}
document.addEventListener("keydown", function(e){ if(tourAt<0) return; if(e.key==="Escape") endTour(); else if(e.key==="ArrowRight"&&tourAt<TOUR.length-1) showTour(tourAt+1); else if(e.key==="ArrowLeft"&&tourAt>0) showTour(tourAt-1); });

render();
var tourSeen=false; try{ tourSeen=!!localStorage.getItem(TOUR_KEY); }catch(e){}
if(!tourSeen && !/[?&]notour/.test(location.search)) setTimeout(startTour, 700);
})();
</script>
</body>
