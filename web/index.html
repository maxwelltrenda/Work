<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Facilities">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f5f4f0">
  <title>Facilities</title>
  <link rel="icon" href="/brand/mc-mark.png">
  <link rel="apple-touch-icon" href="/icons/facilities-apple-touch.png">
  <link rel="manifest" href="/manifest-facilities.webmanifest">
  <script>
    // One app, three web addresses: pick this site's name, icons and colours before anything draws.
    (function () {
      var forced = new URLSearchParams(location.search).get('site');
      var site = /^(facilities|events|media)$/.test(forced) ? forced
        : /media/i.test(location.hostname) ? 'media' : /event/i.test(location.hostname) ? 'events' : 'facilities';
      var names = { facilities: 'Facilities', events: 'Events', media: 'Media Gear' };
      var colors = { facilities: '#ffffff', events: '#11404b', media: '#0f0f0f' };
      document.documentElement.setAttribute('data-site', site);
      document.title = names[site];
      document.querySelector('link[rel="apple-touch-icon"]').href = '/icons/' + site + '-apple-touch.png';
      document.querySelector('link[rel="manifest"]').href = '/manifest-' + site + '.webmanifest';
      document.querySelector('meta[name="apple-mobile-web-app-title"]').content = names[site];
      document.querySelector('meta[name="theme-color"]').content = colors[site];
      window.__SITE = site;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@900&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
</head>
<body>
  <div id="splash" aria-live="polite">
    <div class="splash-mark"><img src="/brand/mc-mark.png" alt=""></div>
    <div class="splash-lockup" aria-label="Mercy Culture Media"><small>MERCY CULTURE</small><b aria-hidden="true">Med<span class="mcm-i"></span>a</b></div>
    <div class="splash-name"></div>
    <div class="splash-sub">Getting things ready…</div>
  </div>
  <script>document.querySelector('#splash .splash-name').textContent = { facilities: 'Facilities', events: 'Events', media: 'Gear' }[window.__SITE];</script>
  <header class="topbar no-print">
    <div class="brand" id="brand"></div>
    <nav id="nav"></nav>
    <div class="who" id="who"></div>
  </header>
  <main id="app"></main>
  <div id="toast" class="toast no-print"></div>
  <div id="print-area"></div>
  <script>
    // If the app can't start (e.g. no connection), don't leave people staring at the splash.
    setTimeout(function () {
      var s = document.getElementById('splash');
      if (s && !s.classList.contains('gone')) {
        s.querySelector('.splash-sub').innerHTML = 'Can\u2019t reach the server. <a href="" onclick="location.reload();return false">Try again</a>';
      }
    }, 12000);
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
