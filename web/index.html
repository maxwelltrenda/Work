<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Inventory">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f5f4f0">
  <title>Shop Inventory</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23f5f4f0'/%3E%3Crect x='6' y='22' width='12' height='11' rx='1.5' fill='%231e2a32' opacity='.45'/%3E%3Crect x='21' y='22' width='12' height='11' rx='1.5' fill='%231e2a32' opacity='.7'/%3E%3Crect x='13.5' y='9' width='12' height='11' rx='1.5' fill='%23ad4e12'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js" defer></script>
</head>
<body>
  <div id="splash" aria-live="polite">
    <div class="splash-mark">
      <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <rect x="6" y="22" width="12" height="11" rx="1.5" fill="#1e2a32" opacity=".45"/>
        <rect x="21" y="22" width="12" height="11" rx="1.5" fill="#1e2a32" opacity=".7"/>
        <rect x="13.5" y="9" width="12" height="11" rx="1.5" fill="#ad4e12"/>
      </svg>
    </div>
    <div class="splash-name">Shop Inventory</div>
    <div class="splash-sub">Getting the shop ready…</div>
  </div>
  <header class="topbar no-print">
    <div class="brand" id="brand"></div>
    <nav id="nav"></nav>
    <div class="who" id="who"></div>
  </header>
  <main id="app"></main>
  <div id="toast" class="toast no-print"></div>
  <div id="print-area"></div>
  <script>
    // If the app can't start (e.g. no connection), don't leave people staring at the splash.
    setTimeout(function () {
      var s = document.getElementById('splash');
      if (s && !s.classList.contains('gone')) {
        s.querySelector('.splash-sub').innerHTML = 'Can\u2019t reach the server. <a href="" onclick="location.reload();return false">Try again</a>';
      }
    }, 12000);
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
