<title>Bramblebrook Farm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/*@STYLE@*/
</style>

<div class="app">
  <header class="top" id="top">
    <div class="brand-row">
      <div class="brand"><b>Bramblebrook</b><small id="almanac">Waking the valley</small></div>
      <button class="journal-btn" data-act="journal" aria-label="Open your journal">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C6.5 4 9.5 4 12 6c2.5-2 5.5-2 8-.5V19c-2.5-1.5-5.5-1.5-8 .5-2.5-2-5.5-2-8-.5z"/><path d="M12 6v13.5"/></svg>
        <span class="badge" id="badge-journal" hidden></span>
      </button>
      <button class="journal-btn bell-btn" id="bell-btn" data-act="notes" aria-label="Notifications" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>
        <span class="badge" id="badge-notes" hidden></span>
      </button>
      <div class="purse">
        <span class="coins" aria-label="Coins"><span class="coin" aria-hidden="true"></span><span id="coins">0</span></span>
        <div class="stam" title="Stamina refills over time">
          <div class="stam-top"><span>Stamina</span><span><b id="stam-now">0</b>/<span id="stam-max">0</span></span></div>
          <div class="bar"><i id="stam-bar"></i></div>
        </div>
      </div>
    </div>
    <div class="skills" id="skills"></div>
    <div class="buffs" id="buffs" hidden></div>
  </header>
  <main id="view" class="view"><div class="boot"><p>Waking the valley…</p></div></main>
</div>
<nav class="tabs" aria-label="Game sections"><div class="tabs-in" id="tabs"></div></nav>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div id="sheet-root"></div>
<div id="scene-root"></div>
<div id="tour-root"></div>
