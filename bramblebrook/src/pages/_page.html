<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09060A">
<title>@TITLE@ · Bramblebrook Farm</title>
<meta name="description" content="@DESC@">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts.css">
<style>
:root { color-scheme: dark; --bg: #09060A; --surface: #150C11; --ink: #F1E4E6; --muted: #B4979D; --line: #3A1C27; --sun: #E3AE4F; --mint: #FF8F9A; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 'Atkinson Hyperlegible', system-ui, sans-serif; padding: max(16px, env(safe-area-inset-top)) 16px 48px; }
main { max-width: 720px; margin: 0 auto; }
header { display: flex; align-items: center; gap: 12px; margin: 8px 0 24px; }
header img { width: 44px; height: 44px; border-radius: 10px; }
header a { color: var(--ink); text-decoration: none; font: 400 26px/1 'Pirata One', Georgia, serif; letter-spacing: .01em; }
h1 { font: 400 clamp(32px, 7vw, 44px)/1.1 'Pirata One', Georgia, serif; letter-spacing: .01em; margin: 0 0 6px; }
h2 { font: 400 25px/1.25 'Pirata One', Georgia, serif; margin: 32px 0 6px; color: var(--sun); }
.when { color: var(--muted); margin: 0 0 24px; }
a { color: var(--mint); }
ul { padding-left: 22px; } li { margin: 4px 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; margin: 16px 0; }
footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<main>
<header><img src="icon-180.png" alt=""><a href="./">Bramblebrook Farm</a></header>
@BODY@
<footer><a href="privacy">Privacy policy</a> · <a href="terms">Terms and community rules</a> · <a href="support">Help</a> · <a href="./">Play</a></footer>
</main>
</body>
</html>
